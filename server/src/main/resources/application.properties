spring.application.name=Nexus

# PostgreSQL connection

spring.datasource.url=jdbc:postgresql://localhost:5432/nexus
# Specifies the URL and database name

# Local development only
server.address=127.0.0.1

spring.datasource.username=nexus_app
# Specifies the user logging into the database

spring.datasource.password=${NEXUS_DB_PASSWORD}
# Passes in the user's password

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax